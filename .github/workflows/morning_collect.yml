name: Morning News Collector
on:
  schedule:
    # 한국시간 오전 9시 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 추가

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      IFLO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.IFLO_GOOGLE_CREDENTIALS_JSON }}
      IFLO_OPENROUTER_API_KEY: ${{ secrets.IFLO_OPENROUTER_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      IFLO_SPREADSHEET_ID: "1tepp3i4NbkEccQXYsPkPjrGZnzu1PQS2GtL_NpgWNrA"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Morning Collector
        run: python cron_morning.py
